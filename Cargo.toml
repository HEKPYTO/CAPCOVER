[package]
name = "capcover"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Zero-false-negative semantic pre-filter for cosine vector search"
keywords = ["vector", "search", "filter", "cosine", "ann"]
categories = ["algorithms", "database-implementations"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/include/**",
  "/scripts/**",
  "/result/**",
  "/.github/workflows/**",
  "/.github/dependabot.yml",
  "/.pre-commit-config.yaml",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
usearch = ["dep:usearch"]

[dependencies]
bytemuck = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usearch = { version = "2.26.6", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 1
