name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, "1.85"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Guard tracked markdown
        run: |
          bad=$(git ls-files '*.md' ':!:README.md' ':!:**/README.md' NOTICE CHANGELOG)
          if [ -n "$bad" ]; then printf '%s\n' "$bad"; echo 'Only README.md and LICENSE may be tracked as markdown'; exit 1; fi
      - name: Guard private paths
        run: |
          if rg -n --no-messages -g '!.github/workflows/ci.yml' '(/Users/|/home/|macbook-pro|fedora-pc|AGENTS\.md|GEMINI\.md|HANDOFF\.md|TODO\.md)' .; then
            echo 'private path or local-only file reference'; exit 1
          fi
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  integrations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo clippy --all-targets --features usearch -- -D warnings
      - run: cargo test --release --features usearch
      - run: bash scripts/capi_test.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo publish --dry-run
      - name: Install packaged binary
        run: |
          cargo install --locked --path . --root "$RUNNER_TEMP/capcover-install"
          "$RUNNER_TEMP/capcover-install/bin/capcover" --version
